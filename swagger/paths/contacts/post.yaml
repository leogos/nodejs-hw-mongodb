tags:
  - Contacts

summary: Create a new contact

operationId: createContact

description: Create a new contact for the authenticated user.

security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: John Doe

          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            example: '+123456789'

          email:
            type: string
            format: email
            example: john@example.com

          isFavourite:
            type: boolean
            example: false

          contactType:
            type: string
            enum:
              - work
              - home
              - personal
            example: personal

          photo:
            type: string
            format: binary

responses:
  '201':
    description: Successfully created a contact.
    content:
      application/json:
        schema:
          type: object

  '400':
    description: Invalid request body.

  '401':
    description: Unauthorized.
